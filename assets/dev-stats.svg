<svg width="830" height="300" viewBox="0 0 830 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abenwilson development stats">
<style>
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.h{font-size:13px;font-weight:700;fill:#fff}
.sm{font-size:10px;fill:#9ca3af}
.num{font-size:19px;font-weight:700}
.lbl{font-size:12px}
@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes gy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bx{transform-box:fill-box;transform-origin:left center;animation:gx 1.2s cubic-bezier(.16,1,.3,1) both}
.by{transform-box:fill-box;transform-origin:center bottom;animation:gy 1.2s cubic-bezier(.16,1,.3,1) both}
.pp{animation:pop .8s ease-out both}
</style>
