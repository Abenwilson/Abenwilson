<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doraemon Waving Bye</title>
<style>
  body { background:#0d1117; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }

  /* ================= 1) COPY THESE STYLES INTO YOUR <style> ================= */

  /* soft glowing red tail */
  @keyframes tailGlowPulse {
    0%, 100% { fill:#ff3b30; filter:drop-shadow(0 0 3px rgba(255,59,48,.8)) drop-shadow(0 0 8px rgba(255,59,48,.6)); }
    50%      { fill:#ff6b6b; filter:drop-shadow(0 0 10px rgba(255,59,48,1)) drop-shadow(0 0 16px rgba(255,107,107,.95)); }
  }
  .doraemon-glowing-tail { animation: tailGlowPulse 1.6s infinite ease-in-out; }

  /* bubble floating */
  @keyframes speechFloat { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-3px); } }
  .speech-anim { animation: speechFloat 2.4s ease-in-out infinite; }

  /* whole arm swings from the shoulder (bye-bye wave) */
  @keyframes armWave {
    0%, 100% { transform: rotate(8deg); }
    25%      { transform: rotate(-22deg); }
    50%      { transform: rotate(10deg); }
    75%      { transform: rotate(-22deg); }
  }
  .dora-arm-wave {
    transform-box: view-box;
    transform-origin: 84px 94px;   /* shoulder point */
    animation: armWave 1.1s ease-in-out infinite;
  }

  /* hand flaps a little extra at the wrist */
  @keyframes handFlap {
    0%, 100% { transform: rotate(-10deg); }
    50%      { transform: rotate(14deg); }
  }
  .dora-hand-flap {
    transform-box: view-box;
    transform-origin: 104px 68px;  /* wrist point */
    animation: handFlap 0.55s ease-in-out infinite;
  }

  /* gentle body bob + blinking eyes */
  @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-1.5px); } }
  .dora-bob { animation: bob 1.1s ease-in-out infinite; }
  @keyframes blink { 0%,92%,100% { transform:scaleY(1); } 96% { transform:scaleY(.1); } }
  .dora-pupil { transform-box: fill-box; transform-origin:center; animation: blink 4s infinite; }

  @media (prefers-reduced-motion: reduce) {
    .dora-arm-wave, .dora-hand-flap, .dora-bob, .dora-pupil, .speech-anim { animation:none; }
  }
</style>
</head>
<body>

<!-- ================= 2) REPLACE your old <span class="relative inline-block align-bottom ml-1"> ... </span> WITH THIS ================= -->
<span class="relative inline-block align-bottom ml-1" style="margin-right:16px;">

  <!-- speech bubble -->
  <span class="speech-anim" style="position:absolute; top:-26px; right:-22px; z-index:20; background:#58a6ff; color:#020617; font-weight:800; font-size:10px; padding:2px 7px; border-radius:999px; border:1px solid #fff; white-space:nowrap;">
    Bye! 👋
  </span>

  <svg width="64" height="77" viewBox="0 0 130 150" fill="none" xmlns="http://www.w3.org/2000/svg" style="overflow:visible; display:inline-block;" aria-label="Doraemon waving goodbye">
    <g class="dora-bob">

      <!-- tail -->
      <path d="M86 122 Q100 122 101 110" stroke="#111827" stroke-width="2.5" fill="none"/>
      <circle class="doraemon-glowing-tail" cx="101" cy="106" r="6" stroke="#111827" stroke-width="1.5"/>

      <!-- feet -->
      <ellipse cx="46" cy="138" rx="14" ry="7" fill="#fff" stroke="#111827" stroke-width="2.5"/>
      <ellipse cx="74" cy="138" rx="14" ry="7" fill="#fff" stroke="#111827" stroke-width="2.5"/>

      <!-- body -->
      <ellipse cx="60" cy="112" rx="28" ry="26" fill="#0096e0" stroke="#111827" stroke-width="3"/>
      <ellipse cx="60" cy="114" rx="20" ry="19" fill="#fff" stroke="#111827" stroke-width="2"/>
      <!-- 4D pocket -->
      <path d="M43 108 L77 108 A17 17 0 0 1 43 108 Z" fill="#fff" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>

      <!-- resting arm (viewer's left) -->
      <path d="M36 96 L26 116" stroke="#111827" stroke-width="13" stroke-linecap="round"/>
      <path d="M36 96 L26 116" stroke="#0096e0" stroke-width="8.5" stroke-linecap="round"/>
      <circle cx="25" cy="119" r="7.5" fill="#fff" stroke="#111827" stroke-width="2.5"/>

      <!-- HEAD -->
      <circle cx="60" cy="44" r="36" fill="#0096e0" stroke="#111827" stroke-width="3"/>
      <!-- white face -->
      <ellipse cx="60" cy="50" rx="30" ry="29" fill="#fff" stroke="#111827" stroke-width="2"/>

      <!-- eyes -->
      <ellipse cx="51" cy="32" rx="9" ry="11" fill="#fff" stroke="#111827" stroke-width="2"/>
      <ellipse cx="69" cy="32" rx="9" ry="11" fill="#fff" stroke="#111827" stroke-width="2"/>
      <g class="dora-pupil">
        <circle cx="55" cy="34" r="3.2" fill="#111827"/>
        <circle cx="65" cy="34" r="3.2" fill="#111827"/>
        <circle cx="56" cy="32.8" r="1" fill="#fff"/>
        <circle cx="66" cy="32.8" r="1" fill="#fff"/>
      </g>

      <!-- nose + line -->
      <circle cx="60" cy="44" r="5.5" fill="#e53935" stroke="#111827" stroke-width="1.5"/>
      <circle cx="58.2" cy="42.2" r="1.6" fill="#fff" opacity=".85"/>
      <line x1="60" y1="49.5" x2="60" y2="64" stroke="#111827" stroke-width="1.8"/>

      <!-- smile -->
      <path d="M36 56 Q60 86 84 56" stroke="#111827" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- whiskers -->
      <g stroke="#111827" stroke-width="1.8" stroke-linecap="round">
        <line x1="24" y1="44" x2="42" y2="49"/>
        <line x1="22" y1="55" x2="41" y2="55"/>
        <line x1="24" y1="66" x2="42" y2="61"/>
        <line x1="96" y1="44" x2="78" y2="49"/>
        <line x1="98" y1="55" x2="79" y2="55"/>
        <line x1="96" y1="66" x2="78" y2="61"/>
      </g>

      <!-- collar + bell -->
      <path d="M36 82 Q60 94 84 82" stroke="#111827" stroke-width="9" stroke-linecap="round" fill="none"/>
      <path d="M36 82 Q60 94 84 82" stroke="#e53935" stroke-width="6" stroke-linecap="round" fill="none"/>
      <circle cx="60" cy="92" r="6.5" fill="#ffd700" stroke="#111827" stroke-width="1.8"/>
      <line x1="53.8" y1="91" x2="66.2" y2="91" stroke="#111827" stroke-width="1.2"/>
      <circle cx="60" cy="94.5" r="1.3" fill="#111827"/>

      <!-- WAVING ARM (viewer's right) -->
      <g class="dora-arm-wave">
        <path d="M84 94 L104 68" stroke="#111827" stroke-width="13" stroke-linecap="round"/>
        <path d="M84 94 L104 68" stroke="#0096e0" stroke-width="8.5" stroke-linecap="round"/>
        <g class="dora-hand-flap">
          <circle cx="107" cy="62" r="8.5" fill="#fff" stroke="#111827" stroke-width="2.5"/>
        </g>
      </g>

    </g>
  </svg>
</span>

</body>
</html>
